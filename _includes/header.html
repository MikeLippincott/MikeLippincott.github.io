<!-- Header -->
<header>
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
            <img class="img-responsive profile-pic" src="img/profile.png" alt="profile-pic" />
          <div class="intro-text">
            <span class="name">{{ site.title }}</span>
            <hr class="star-light" />
            <span class="skills">{{ site.skills }}</span>
          </div>
          <div>
            <span class="skills">{{ site.university }}</span>
            <div class="footer-col col-md-12">
          <!-- <h3>{{ site.footer.social }}</h3> -->
          <ul class="list-inline">
            {% for network in site.social %}
            <li>
              <a href="{{ network.url }}" class="btn-social btn-outline"><i
                  class="fa-brands fa-fw fa-{{ network.title }}"></i></a>
            </li>
            {% endfor %}
          </ul>
        </div>
          </div>
    </div>
  </header>
